<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>交換管理</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f7f7f7;
  color:#444;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
}

header{
  background:#fff;
  border-bottom:1px solid #e8e8e8;
  padding:20px 16px;
  position:sticky;
  top:0;
  z-index:10;
}

main{
  max-width:760px;
  margin:auto;
  padding:16px;
}

h1{
  margin:0;
  font-size:25px;
  letter-spacing:.03em;
}

small{
  color:#999;
}

button,
input,
textarea,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

.tabs{
  display:flex;
  gap:8px;
  margin-top:16px;
}

.tab{
  border:0;
  border-radius:20px;
  padding:9px 15px;
  background:#eee;
  color:#666;
}

.tab.active{
  background:#8f8f8f;
  color:#fff;
}

.toolbar{
  display:flex;
  gap:8px;
  margin-bottom:15px;
}

#search{
  flex:1;
  min-width:0;
  border:1px solid #ddd;
  border-radius:10px;
  padding:11px;
  background:#fff;
}

.add{
  background:#8f8f8f;
  color:#fff;
  border:0;
  border-radius:10px;
  padding:10px 14px;
  white-space:nowrap;
}

/* =========================
   グループ
========================= */

.group{
  margin-bottom:24px;
}

.group-header{
  background:#fff;
  border:1px solid #e3e3e3;
  border-radius:18px 18px 0 0;
  padding:15px;
  box-shadow:0 2px 8px rgba(0,0,0,.03);
}

.group-title-row{
  display:flex;
  align-items:flex-start;
  gap:12px;
}

.group-image{
  width:78px;
  height:78px;
  object-fit:cover;
  border-radius:13px;
  background:#f1f1f1;
  flex-shrink:0;
  cursor:pointer;
}

.group-info{
  min-width:0;
  flex:1;
}

.group-name{
  font-size:17px;
  font-weight:bold;
  line-height:1.45;
  word-break:break-word;
}

.group-date{
  margin-top:5px;
  font-size:12px;
  color:#888;
}

.group-count{
  margin-top:5px;
  font-size:12px;
  color:#999;
}

.group-stats{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin-top:12px;
}

.stat{
  border-radius:20px;
  padding:5px 9px;
  background:#f1f1f1;
  color:#666;
  font-size:11px;
  white-space:nowrap;
}

.group-actions{
  display:flex;
  gap:7px;
  margin-top:12px;
}

.group-actions button{
  flex:1;
  border:1px solid #ddd;
  background:#fff;
  color:#666;
  border-radius:8px;
  padding:7px;
  font-size:12px;
}

/* =========================
   交換カード
========================= */

.exchange-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
  padding-top:10px;
}

.card{
  background:#fff;
  border:1px solid #e8e8e8;
  border-radius:14px;
  padding:12px;
  box-shadow:0 2px 8px rgba(0,0,0,.03);
  min-width:0;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:7px;
}

.name{
  font-size:14px;
  font-weight:bold;
  line-height:1.4;
  word-break:break-word;
}

.xid{
  margin-top:4px;
  font-size:11px;
  font-weight:bold;
  word-break:break-all;
}

.xid a{
  color:#777;
  text-decoration:none;
}

.badge{
  font-size:9px;
  background:#eee;
  color:#666;
  border-radius:20px;
  padding:4px 7px;
  white-space:nowrap;
  flex-shrink:0;
}

.characters{
  margin-top:12px;
  font-size:15px;
  font-weight:bold;
  line-height:1.5;
  color:#444;
  word-break:break-word;
}

.meta{
  font-size:10px;
  color:#888;
  margin-top:10px;
  line-height:1.7;
  word-break:break-word;
}

.actions{
  display:flex;
  gap:5px;
  margin-top:10px;
}

.actions button{
  flex:1;
  border:1px solid #ddd;
  background:#fff;
  color:#666;
  border-radius:7px;
  padding:6px 3px;
  font-size:11px;
}

/* =========================
   空表示
========================= */

.empty{
  text-align:center;
  color:#999;
  padding:50px 10px;
}

/* =========================
   ダイアログ
========================= */

dialog{
  border:0;
  border-radius:18px;
  width:calc(100% - 24px);
  max-width:650px;
  padding:20px;
  box-shadow:0 10px 40px rgba(0,0,0,.15);
}

dialog::backdrop{
  background:rgba(0,0,0,.45);
}

.field{
  margin-bottom:13px;
}

.field label{
  display:block;
  font-size:12px;
  font-weight:bold;
  margin-bottom:5px;
  color:#666;
}

.field input,
.field textarea,
.field select{
  width:100%;
  padding:10px;
  border:1px solid #ddd;
  border-radius:9px;
  background:#fff;
  color:#444;
}

.field input:focus,
.field textarea:focus,
.field select:focus{
  outline:none;
  border-color:#aaa;
}

.image-preview{
  width:100%;
  max-height:220px;
  object-fit:contain;
  background:#f5f5f5;
  border-radius:10px;
  margin-top:8px;
  display:none;
}

.image-buttons{
  margin-top:8px;
}

.image-buttons button{
  width:100%;
  padding:8px;
  border:1px solid #ddd;
  background:#fff;
  border-radius:8px;
  color:#777;
}

.photo-note{
  font-size:11px;
  color:#999;
  margin-top:5px;
  line-height:1.5;
}

.save{
  width:100%;
  padding:11px;
  border:0;
  border-radius:10px;
  background:#8f8f8f;
  color:#fff;
}

.cancel{
  width:100%;
  padding:10px;
  border:1px solid #ddd;
  border-radius:10px;
  background:#fff;
  color:#666;
  margin-top:7px;
}

/* =========================
   グループ編集
========================= */

.group-form-note{
  font-size:11px;
  color:#999;
  line-height:1.5;
  margin-top:5px;
}

/* =========================
   画像拡大
========================= */

.lightbox{
  width:calc(100% - 24px);
  max-width:900px;
  padding:10px;
  background:transparent;
  box-shadow:none;
}

.lightbox::backdrop{
  background:rgba(0,0,0,.75);
}

.lightbox img{
  width:100%;
  max-height:85vh;
  object-fit:contain;
  border-radius:10px;
}

.close-photo{
  position:absolute;
  top:-5px;
  right:0;
  border:0;
  background:#fff;
  width:35px;
  height:35px;
  border-radius:50%;
  font-size:20px;
}

/* =========================
   スマホ
========================= */

@media(max-width:500px){

  .toolbar{
    flex-wrap:wrap;
  }

  #search{
    width:100%;
    flex-basis:100%;
  }

  .add{
    width:100%;
  }

  .group-image{
    width:70px;
    height:70px;
  }

  .group-name{
    font-size:15px;
  }

  .exchange-grid{
    gap:8px;
  }

  .card{
    padding:10px;
  }

  .characters{
    font-size:14px;
  }

  .badge{
    font-size:8px;
    padding:3px 5px;
  }
}
</style>
</head>

<body>

<header>

  <h1>交換管理</h1>

  <small>
    交換・取引をまとめて管理
  </small>

  <div class="tabs">

    <button class="tab active" id="allTab">
      すべて
    </button>

    <button class="tab" id="activeTab">
      未完了
    </button>

    <button class="tab" id="doneTab">
      完了
    </button>

  </div>

</header>

<main>

  <div class="toolbar">

    <input
      id="search"
      placeholder="名前・X ID・交換内容・キャラを検索"
    >

    <button class="add" id="addButton">
      ＋ 交換を追加
    </button>

  </div>

  <div id="list"></div>

</main>


<!-- =========================
     交換追加・編集
========================= -->

<dialog id="formDialog">

  <h2 id="formTitle">交換を追加</h2>

  <form id="exchangeForm">

    <input
      type="hidden"
      id="editId"
    >

    <div class="field">

      <label>交換内容 *</label>

      <input
        id="itemType"
        required
        placeholder="例：あんさんぶるスターズ！！ ぱしゃっつ Vol.6"
      >

      <div class="group-form-note">
        同じ名前を入力すると、自動で同じファイルにまとまります。
      </div>

    </div>


    <div class="field">

      <label>交換内容の画像</label>

      <input
        id="image"
        type="file"
        accept="image/*"
      >

      <div class="photo-note">
        この「交換内容」の画像を1枚登録できます。<br>
        同じ交換内容の交換すべてに同じ画像が表示されます。
      </div>

      <img
        id="imagePreview"
        class="image-preview"
      >

      <div class="image-buttons">

        <button
          type="button"
          id="removeImageButton"
        >
          この交換内容の画像を削除
        </button>

      </div>

    </div>


    <div class="field">

      <label>交換するもの *</label>

      <input
        id="characters"
        required
        placeholder="𓏸𓏸 ↔ 𓏸𓏸"
      >

    </div>


    <div class="field">

      <label>相手の名前 *</label>

      <input
        id="name"
        required
      >

    </div>


    <div class="field">

      <label>X ID</label>

      <input
        id="xid"
        placeholder="@example"
      >

    </div>


    <div class="field">

      <label>取引方法</label>

      <select id="method">

        <option value="郵送">郵送</option>
        <option value="手渡し">手渡し</option>
        <option value="その他">その他</option>

      </select>

    </div>


    <div class="field">

      <label>ステータス</label>

      <select id="status">

        <option value="約束済み">📝 約束済み</option>
        <option value="梱包済み">📦 梱包済み</option>
        <option value="発送済み">📮 発送済み</option>
        <option value="到着待ち">📬 到着待ち</option>
        <option value="完了">✅ 完了</option>

      </select>

    </div>


    <div class="field">

      <label>交換予定日</label>

      <input
        id="date"
        type="date"
      >

    </div>


    <div class="field">

      <label>イベント・会場</label>

      <input id="event">

    </div>


    <div class="field">

      <label>メモ</label>

      <textarea
        id="memo"
        rows="3"
      ></textarea>

    </div>


    <button
      type="submit"
      class="save"
    >
      保存
    </button>


    <button
      type="button"
      class="cancel"
      id="cancelButton"
    >
      キャンセル
    </button>

  </form>

</dialog>


<!-- =========================
     ファイル編集
========================= -->

<dialog id="groupDialog">

  <h2>グッズ情報を編集</h2>

  <form id="groupForm">

    <input
      type="hidden"
      id="groupOldName"
    >

    <div class="field">

      <label>グッズ名 *</label>

      <input
        id="groupName"
        required
      >

    </div>


    <div class="field">

      <label>発売日</label>

      <input
        id="groupDate"
        type="date"
      >

    </div>


    <div class="field">

      <label>代表画像</label>

      <input
        id="groupImage"
        type="file"
        accept="image/*"
      >

      <img
        id="groupImagePreview"
        class="image-preview"
      >

      <div class="image-buttons">

        <button
          type="button"
          id="removeGroupImageButton"
        >
          代表画像を削除
        </button>

      </div>

    </div>


    <button
      type="submit"
      class="save"
    >
      保存
    </button>

    <button
      type="button"
      class="cancel"
      id="cancelGroupButton"
    >
      キャンセル
    </button>

  </form>

</dialog>


<!-- =========================
     画像拡大
========================= -->

<dialog
  id="photoDialog"
  class="lightbox"
>

  <button
    type="button"
    class="close-photo"
    id="closePhotoButton"
  >
    ×
  </button>

  <img id="largePhoto">

</dialog>


<script>

const STORAGE_KEY = "exchangeData";
const IMAGE_STORAGE_KEY = "categoryImages";
const GROUP_STORAGE_KEY = "exchangeGroups";

let data = [];
let categoryImages = {};
let groups = {};
let currentFilter = "all";

let currentImage = "";
let currentImageType = "";

let currentGroupImage = "";
let currentEditingGroup = "";


/* =========================
   DOM
========================= */

const formDialog =
  document.getElementById("formDialog");

const groupDialog =
  document.getElementById("groupDialog");

const photoDialog =
  document.getElementById("photoDialog");

const exchangeForm =
  document.getElementById("exchangeForm");

const groupForm =
  document.getElementById("groupForm");

const formTitle =
  document.getElementById("formTitle");

const editId =
  document.getElementById("editId");

const itemType =
  document.getElementById("itemType");

const imageInput =
  document.getElementById("image");

const imagePreview =
  document.getElementById("imagePreview");

const charactersInput =
  document.getElementById("characters");

const nameInput =
  document.getElementById("name");

const xidInput =
  document.getElementById("xid");

const methodInput =
  document.getElementById("method");

const statusInput =
  document.getElementById("status");

const dateInput =
  document.getElementById("date");

const eventInput =
  document.getElementById("event");

const memoInput =
  document.getElementById("memo");

const searchInput =
  document.getElementById("search");

const listElement =
  document.getElementById("list");

const groupOldName =
  document.getElementById("groupOldName");

const groupName =
  document.getElementById("groupName");

const groupDate =
  document.getElementById("groupDate");

const groupImage =
  document.getElementById("groupImage");

const groupImagePreview =
  document.getElementById("groupImagePreview");


/* =========================
   データ読み込み
========================= */

try{

  data = JSON.parse(
    localStorage.getItem(STORAGE_KEY) || "[]"
  );

  if(!Array.isArray(data)){
    data = [];
  }

}catch(error){

  data = [];

}


try{

  categoryImages = JSON.parse(
    localStorage.getItem(IMAGE_STORAGE_KEY) || "{}"
  );

  if(
    !categoryImages ||
    typeof categoryImages !== "object"
  ){

    categoryImages = {};

  }

}catch(error){

  categoryImages = {};

}


try{

  groups = JSON.parse(
    localStorage.getItem(GROUP_STORAGE_KEY) || "{}"
  );

  if(
    !groups ||
    typeof groups !== "object"
  ){

    groups = {};

  }

}catch(error){

  groups = {};

}


/* =========================
   古い画像データ移行
========================= */

data.forEach(function(item){

  if(
    item.image &&
    item.itemType &&
    !categoryImages[item.itemType]
  ){

    categoryImages[item.itemType] =
      item.image;

  }

});


try{

  localStorage.setItem(
    IMAGE_STORAGE_KEY,
    JSON.stringify(categoryImages)
  );

}catch(error){}


/* =========================
   保存
========================= */

function saveData(){

  try{

    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(data)
    );

    return true;

  }catch(error){

    alert(
      "保存できませんでした。\n画像の容量が大きすぎる可能性があります。"
    );

    return false;

  }

}


function saveImages(){

  try{

    localStorage.setItem(
      IMAGE_STORAGE_KEY,
      JSON.stringify(categoryImages)
    );

    return true;

  }catch(error){

    alert(
      "画像を保存できませんでした。\n画像の容量が大きすぎる可能性があります。"
    );

    return false;

  }

}


function saveGroups(){

  try{

    localStorage.setItem(
      GROUP_STORAGE_KEY,
      JSON.stringify(groups)
    );

    return true;

  }catch(error){

    alert(
      "グッズ情報を保存できませんでした。"
    );

    return false;

  }

}


/* =========================
   画像圧縮
========================= */

function compressImage(file){

  return new Promise(function(resolve,reject){

    const reader =
      new FileReader();

    reader.onload = function(event){

      const img =
        new Image();

      img.onload = function(){

        const maxSize = 900;

        let width = img.width;
        let height = img.height;

        if(
          width > maxSize ||
          height > maxSize
        ){

          if(width >= height){

            height =
              Math.round(
                height * maxSize / width
              );

            width = maxSize;

          }else{

            width =
              Math.round(
                width * maxSize / height
              );

            height = maxSize;

          }

        }

        const canvas =
          document.createElement("canvas");

        canvas.width = width;
        canvas.height = height;

        const ctx =
          canvas.getContext("2d");

        ctx.drawImage(
          img,
          0,
          0,
          width,
          height
        );

        resolve(
          canvas.toDataURL(
            "image/jpeg",
            0.7
          )
        );

      };

      img.onerror = function(){

        reject(
          new Error("画像読み込みエラー")
        );

      };

      img.src =
        event.target.result;

    };

    reader.onerror = function(){

      reject(
        new Error("ファイル読み込みエラー")
      );

    };

    reader.readAsDataURL(file);

  });

}


/* =========================
   交換追加フォーム
========================= */

function openForm(item = null){

  formTitle.textContent =
    item
      ? "交換を編集"
      : "交換を追加";

  editId.value =
    item?.id || "";

  itemType.value =
    item?.itemType || "";

  charactersInput.value =
    item?.characters || "";

  nameInput.value =
    item?.name || "";

  xidInput.value =
    item?.xid || "";

  methodInput.value =
    item?.method || "郵送";

  statusInput.value =
    item?.status || "約束済み";

  dateInput.value =
    item?.date || "";

  eventInput.value =
    item?.event || "";

  memoInput.value =
    item?.memo || "";

  currentImageType =
    item?.itemType || "";

  currentImage =
    categoryImages[currentImageType] || "";

  if(currentImage){

    imagePreview.src =
      currentImage;

    imagePreview.style.display =
      "block";

  }else{

    imagePreview.src = "";

    imagePreview.style.display =
      "none";

  }

  imageInput.value = "";

  formDialog.showModal();

}


/* =========================
   画像選択
========================= */

imageInput.addEventListener(
  "change",
  async function(){

    const file =
      imageInput.files[0];

    if(!file){
      return;
    }

    const selectedType =
      itemType.value.trim();

    if(!selectedType){

      alert(
        "先に交換内容を入力してね！"
      );

      imageInput.value = "";

      return;

    }

    try{

      currentImage =
        await compressImage(file);

      currentImageType =
        selectedType;

      imagePreview.src =
        currentImage;

      imagePreview.style.display =
        "block";

    }catch(error){

      alert(
        "画像を読み込めませんでした。"
      );

    }

  }
);


/* =========================
   交換内容変更
========================= */

itemType.addEventListener(
  "input",
  function(){

    const selectedType =
      itemType.value.trim();

    currentImageType =
      selectedType;

    currentImage =
      categoryImages[selectedType] || "";

    if(currentImage){

      imagePreview.src =
        currentImage;

      imagePreview.style.display =
        "block";

    }else{

      imagePreview.src = "";

      imagePreview.style.display =
        "none";

    }

  }
);


/* =========================
   画像削除
========================= */

document
  .getElementById("removeImageButton")
  .addEventListener(
    "click",
    function(){

      const selectedType =
        itemType.value.trim();

      if(selectedType){

        delete categoryImages[selectedType];

        saveImages();

      }

      currentImage = "";

      currentImageType = "";

      imageInput.value = "";

      imagePreview.src = "";

      imagePreview.style.display =
        "none";

      show();

    }
  );


/* =========================
   新規追加
========================= */

document
  .getElementById("addButton")
  .addEventListener(
    "click",
    function(){

      openForm();

    }
  );


/* =========================
   キャンセル
========================= */

document
  .getElementById("cancelButton")
  .addEventListener(
    "click",
    function(){

      formDialog.close();

    }
  );


/* =========================
   交換保存
========================= */

exchangeForm.addEventListener(
  "submit",
  async function(event){

    event.preventDefault();

    const selectedType =
      itemType.value.trim();

    const characterText =
      charactersInput.value.trim();

    const partnerName =
      nameInput.value.trim();

    if(!selectedType){

      alert(
        "交換内容を入力してね！"
      );

      itemType.focus();

      return;

    }

    if(!characterText){

      alert(
        "交換するものを入力してね！"
      );

      charactersInput.focus();

      return;

    }

    if(!partnerName){

      alert(
        "相手の名前を入力してね！"
      );

      nameInput.focus();

      return;

    }

    /* 画像保存 */

    if(
      currentImage &&
      currentImageType === selectedType
    ){

      categoryImages[selectedType] =
        currentImage;

      if(!saveImages()){

        return;

      }

    }

    /* 新しい交換 */

    const newItem = {

      id:
        editId.value ||
        Date.now().toString(),

      itemType:
        selectedType,

      characters:
        characterText,

      name:
        partnerName,

      xid:
        xidInput.value.trim(),

      method:
        methodInput.value,

      status:
        statusInput.value,

      date:
        dateInput.value,

      event:
        eventInput.value.trim(),

      memo:
        memoInput.value.trim()

    };

    const existingIndex =
      data.findIndex(
        function(item){

          return item.id ===
            newItem.id;

        }
      );

    if(existingIndex >= 0){

      data[existingIndex] =
        newItem;

    }else{

      data.unshift(
        newItem
      );

    }

    if(saveData()){

      formDialog.close();

      exchangeForm.reset();

      currentImage = "";

      currentImageType = "";

      imagePreview.src = "";

      imagePreview.style.display =
        "none";

      show();

    }

  }
);


/* =========================
   編集
========================= */

function editItem(id){

  const item =
    data.find(
      function(x){

        return x.id === id;

      }
    );

  if(item){

    openForm(item);

  }

}


/* =========================
   削除
========================= */

function deleteItem(id){

  if(
    !confirm(
      "この交換を削除しますか？"
    )
  ){

    return;

  }

  data =
    data.filter(
      function(item){

        return item.id !== id;

      }
    );

  saveData();

  show();

}


/* =========================
   ファイル情報
========================= */

function getGroup(name){

  if(!groups[name]){

    groups[name] = {

      date:"",
      image:""

    };

  }

  return groups[name];

}


/* =========================
   ファイル編集を開く
========================= */

function openGroupEditor(name){

  const group =
    getGroup(name);

  currentEditingGroup =
    name;

  groupOldName.value =
    name;

  groupName.value =
    name;

  groupDate.value =
    group.date || "";

  currentGroupImage =
    group.image ||
    categoryImages[name] ||
    "";

  if(currentGroupImage){

    groupImagePreview.src =
      currentGroupImage;

    groupImagePreview.style.display =
      "block";

  }else{

    groupImagePreview.src = "";

    groupImagePreview.style.display =
      "none";

  }

  groupImage.value = "";

  groupDialog.showModal();

}


/* =========================
   ファイル画像選択
========================= */

groupImage.addEventListener(
  "change",
  async function(){

    const file =
      groupImage.files[0];

    if(!file){
      return;
    }

    try{

      currentGroupImage =
        await compressImage(file);

      groupImagePreview.src =
        currentGroupImage;

      groupImagePreview.style.display =
        "block";

    }catch(error){

      alert(
        "画像を読み込めませんでした。"
      );

    }

  }
);


/* =========================
   ファイル画像削除
========================= */

document
  .getElementById("removeGroupImageButton")
  .addEventListener(
    "click",
    function(){

      currentGroupImage = "";

      groupImage.value = "";

      groupImagePreview.src = "";

      groupImagePreview.style.display =
        "none";

    }
  );


/* =========================
   ファイル編集保存
========================= */

groupForm.addEventListener(
  "submit",
  function(event){

    event.preventDefault();

    const oldName =
      groupOldName.value.trim();

    const newName =
      groupName.value.trim();

    if(!newName){

      alert(
        "グッズ名を入力してね！"
      );

      return;

    }

    /*
      名前を変更した場合、
      そのファイル内の交換も全部新しい名前へ変更
    */

    if(
      oldName !== newName
    ){

      data =
        data.map(
          function(item){

            if(item.itemType === oldName){

              item.itemType =
                newName;

            }

            return item;

          }
        );

      if(categoryImages[oldName]){

        categoryImages[newName] =
          categoryImages[oldName];

        delete categoryImages[oldName];

      }

      if(groups[oldName]){

        groups[newName] =
          groups[oldName];

        delete groups[oldName];

      }

    }

    groups[newName] = {

      date:
        groupDate.value,

      image:
        currentGroupImage || ""

    };

    if(currentGroupImage){

      categoryImages[newName] =
        currentGroupImage;

    }else{

      delete categoryImages[newName];

    }

    saveData();

    saveImages();

    saveGroups();

    groupDialog.close();

    show();

  }
);


/* =========================
   ファイル削除
========================= */

function deleteGroup(name){

  const count =
    data.filter(
      function(item){

        return item.itemType === name;

      }
    ).length;

  const message =
    count > 0
      ? `「${name}」には${count}件の交換があります。\nファイルと中の交換をすべて削除しますか？`
      : `「${name}」を削除しますか？`;

  if(!confirm(message)){

    return;

  }

  data =
    data.filter(
      function(item){

        return item.itemType !== name;

      }
    );

  delete groups[name];

  delete categoryImages[name];

  saveData();

  saveGroups();

  saveImages();

  show();

}


/* =========================
   フィルター
========================= */

function setFilter(type){

  currentFilter =
    type;

  document
    .querySelectorAll(".tab")
    .forEach(
      function(button){

        button.classList.remove(
          "active"
        );

      }
    );

  if(type === "all"){

    document
      .getElementById("allTab")
      .classList.add("active");

  }

  if(type === "active"){

    document
      .getElementById("activeTab")
      .classList.add("active");

  }

  if(type === "done"){

    document
      .getElementById("doneTab")
      .classList.add("active");

  }

  show();

}


document
  .getElementById("allTab")
  .addEventListener(
    "click",
    function(){

      setFilter("all");

    }
  );


document
  .getElementById("activeTab")
  .addEventListener(
    "click",
    function(){

      setFilter("active");

    }
  );


document
  .getElementById("doneTab")
  .addEventListener(
    "click",
    function(){

      setFilter("done");

    }
  );


/* =========================
   検索
========================= */

searchInput.addEventListener(
  "input",
  show
);


/* =========================
   画像拡大
========================= */

function openPhoto(src){

  document
    .getElementById("largePhoto")
    .src = src;

  photoDialog.showModal();

}


document
  .getElementById("closePhotoButton")
  .addEventListener(
    "click",
    function(){

      photoDialog.close();

    }
  );


/* =========================
   ステータスアイコン
========================= */

function statusIcon(status){

  if(status === "約束済み"){
    return "📝";
  }

  if(status === "梱包済み"){
    return "📦";
  }

  if(status === "発送済み"){
    return "📮";
  }

  if(status === "到着待ち"){
    return "📬";
  }

  if(status === "完了"){
    return "✅";
  }

  return "📝";

}


/* =========================
   表示
========================= */

function show(){

  const keyword =
    searchInput.value
      .toLowerCase()
      .trim();

  /*
    まず交換をフィルター
  */

  const filtered =
    data.filter(
      function(item){

        const searchText = [

          item.name,

          item.xid,

          item.itemType,

          item.characters,

          item.event,

          item.memo

        ]
          .join(" ")
          .toLowerCase();

        const matchesSearch =
          searchText.includes(
            keyword
          );

        let matchesFilter =
          true;

        if(
          currentFilter === "active"
        ){

          matchesFilter =
            item.status !== "完了";

        }

        if(
          currentFilter === "done"
        ){

          matchesFilter =
            item.status === "完了";

        }

        return (
          matchesSearch &&
          matchesFilter
        );

      }
    );


  if(filtered.length === 0){

    listElement.innerHTML = `
      <div class="empty">
        交換情報がありません
        <br><br>
        「＋ 交換を追加」から登録してね！
      </div>
    `;

    return;

  }


  /*
    グッズ名ごとに自動グループ化
  */

  const grouped = {};

  filtered.forEach(
    function(item){

      if(!grouped[item.itemType]){

        grouped[item.itemType] =
          [];

      }

      grouped[item.itemType].push(
        item
      );

    }
  );


  /*
    グループの順番
    ・既存データの最初の登録順
  */

  const groupNames =
    Object.keys(grouped);


  listElement.innerHTML =
    groupNames
      .map(
        function(groupName){

          const items =
            grouped[groupName];

          const group =
            getGroup(groupName);

          const groupImage =
            group.image ||
            categoryImages[groupName] ||
            "";

          const imageHtml =
            groupImage
              ? `
                <img
                  class="group-image"
                  src="${groupImage}"
                  data-photo="${encodeURIComponent(groupImage)}"
                >
              `
              : `
                <div class="group-image"></div>
              `;


          /*
            ステータス集計
          */

          const countPromise =
            items.filter(
              function(x){
                return x.status === "約束済み";
              }
            ).length;

          const countPacked =
            items.filter(
              function(x){
                return x.status === "梱包済み";
              }
            ).length;

          const countSent =
            items.filter(
              function(x){
                return x.status === "発送済み";
              }
            ).length;

          const countWaiting =
            items.filter(
              function(x){
                return x.status === "到着待ち";
              }
            ).length;

          const countDone =
            items.filter(
              function(x){
                return x.status === "完了";
              }
            ).length;


          const cards =
            items
              .map(
                function(item){

                  const xidHtml =
                    item.xid
                      ? `
                        <div class="xid">
                          <a
                            href="https://x.com/${encodeURIComponent(
                              item.xid.replace(/^@/,"")
                            )}"
                            target="_blank"
                            rel="noopener noreferrer"
                          >
                            ${escapeHtml(item.xid)}
                          </a>
                        </div>
                      `
                      : "";


                  const metaParts = [];


                  if(item.method){

                    metaParts.push(
                      "📦 " +
                      escapeHtml(
                        item.method
                      )
                    );

                  }


                  if(item.date){

                    metaParts.push(
                      "📅 " +
                      escapeHtml(
                        item.date
                      )
                    );

                  }


                  let metaHtml =
                    metaParts.join("　");


                  if(item.event){

                    metaHtml +=
                      "<br>📍 " +
                      escapeHtml(
                        item.event
                      );

                  }


                  if(item.memo){

                    metaHtml +=
                      "<br>📝 " +
                      escapeHtml(
                        item.memo
                      );

                  }


                  return `

                    <div class="card">

                      <div class="top">

                        <div>

                          <div class="name">
                            ${escapeHtml(
                              item.name
                            )}
                          </div>

                          ${xidHtml}

                        </div>

                        <div class="badge">
                          ${statusIcon(item.status)}
                          ${escapeHtml(item.status)}
                        </div>

                      </div>


                      <div class="characters">
                        ${escapeHtml(
                          item.characters
                        )}
                      </div>


                      ${
                        metaHtml
                          ? `
                            <div class="meta">
                              ${metaHtml}
                            </div>
                          `
                          : ""
                      }


                      <div class="actions">

                        <button
                          type="button"
                          data-edit="${escapeHtml(item.id)}"
                        >
                          編集
                        </button>

                        <button
                          type="button"
                          data-delete="${escapeHtml(item.id)}"
                        >
                          削除
                        </button>

                      </div>

                    </div>

                  `;

                }
              )
              .join("");


          return `

            <section class="group">

              <div class="group-header">

                <div class="group-title-row">

                  ${imageHtml}

                  <div class="group-info">

                    <div class="group-name">
                      ${escapeHtml(groupName)}
                    </div>

                    ${
                      group.date
                        ? `
                          <div class="group-date">
                            📅 発売日 ${escapeHtml(group.date)}
                          </div>
                        `
                        : ""
                    }

                    <div class="group-count">
                      全 ${items.length}件
                    </div>

                  </div>

                </div>


                <div class="group-stats">

                  <div class="stat">
                    📝 ${countPromise}
                  </div>

                  <div class="stat">
                    📦 ${countPacked}
                  </div>

                  <div class="stat">
                    📮 ${countSent}
                  </div>

                  <div class="stat">
                    📬 ${countWaiting}
                  </div>

                  <div class="stat">
                    ✅ ${countDone}
                  </div>

                </div>


                <div class="group-actions">

                  <button
                    type="button"
                    data-group-edit="${escapeHtml(groupName)}"
                  >
                    ⚙ グッズ情報
                  </button>

                  <button
                    type="button"
                    data-group-delete="${escapeHtml(groupName)}"
                  >
                    ファイル削除
                  </button>

                </div>

              </div>


              <div class="exchange-grid">

                ${cards}

              </div>

            </section>

          `;

        }
      )
      .join("");


  /* =========================
     交換編集
  ========================= */

  listElement
    .querySelectorAll("[data-edit]")
    .forEach(
      function(button){

        button.addEventListener(
          "click",
          function(){

            editItem(
              button.dataset.edit
            );

          }
        );

      }
    );


  /* =========================
     交換削除
  ========================= */

  listElement
    .querySelectorAll("[data-delete]")
    .forEach(
      function(button){

        button.addEventListener(
          "click",
          function(){

            deleteItem(
              button.dataset.delete
            );

          }
        );

      }
    );


  /* =========================
     ファイル編集
  ========================= */

  listElement
    .querySelectorAll("[data-group-edit]")
    .forEach(
      function(button){

        button.addEventListener(
          "click",
          function(){

            openGroupEditor(
              button.dataset.groupEdit
            );

          }
        );

      }
    );


  /* =========================
     ファイル削除
  ========================= */

  listElement
    .querySelectorAll("[data-group-delete]")
    .forEach(
      function(button){

        button.addEventListener(
          "click",
          function(){

            deleteGroup(
              button.dataset.groupDelete
            );

          }
        );

      }
    );


  /* =========================
     画像
  ========================= */

  listElement
    .querySelectorAll("[data-photo]")
    .forEach(
      function(image){

        image.addEventListener(
          "click",
          function(){

            openPhoto(
              decodeURIComponent(
                image.dataset.photo
              )
            );

          }
        );

      }
    );

}


/* =========================
   HTML対策
========================= */

function escapeHtml(text){

  return String(
    text || ""
  )
    .replaceAll(
      "&",
      "&amp;"
    )
    .replaceAll(
      "<",
      "&lt;"
    )
    .replaceAll(
      ">",
      "&gt;"
    )
    .replaceAll(
      '"',
      "&quot;"
    )
    .replaceAll(
      "'",
      "&#039;"
    );

}


/* =========================
   グループダイアログ
   キャンセル
========================= */

document
  .getElementById("cancelGroupButton")
  .addEventListener(
    "click",
    function(){

      groupDialog.close();

    }
  );


/* =========================
   初期表示
========================= */

show();

</script>

</body>
</html>
