<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>交換管理</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fff7fb;color:#333;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
header{background:white;border-bottom:1px solid #eee;padding:20px 16px;position:sticky;top:0}
main{max-width:700px;margin:auto;padding:16px}
h1{margin:0;font-size:25px}
small{color:#888}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.tabs{display:flex;gap:8px;margin-top:16px}
.tab{border:0;border-radius:20px;padding:9px 14px;background:#eee}
.tab.active{background:#333;color:white}
.toolbar{display:flex;gap:8px;margin-bottom:15px}
#search{flex:1;border:1px solid #ddd;border-radius:10px;padding:11px}
.add{background:#333;color:white;border:0;border-radius:10px;padding:10px 14px}
.card{background:white;border:1px solid #eee;border-radius:15px;padding:15px;margin-bottom:12px}
.top{display:flex;justify-content:space-between}
.name{font-weight:bold;font-size:17px}
.xid{font-size:12px;color:#888;margin-top:3px}
.badge{font-size:11px;background:#eee;border-radius:20px;padding:5px 8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:15px}
.label{font-size:11px;color:#999}
.value{margin-top:3px;white-space:pre-wrap}
.meta{font-size:12px;color:#777;margin-top:12px;line-height:1.7}
.actions{display:flex;gap:7px;margin-top:14px}
.actions button{flex:1;border:1px solid #ddd;background:white;border-radius:8px;padding:8px}
.empty{text-align:center;color:#999;padding:50px 10px}
dialog{border:0;border-radius:18px;width:calc(100% - 24px);max-width:650px;padding:20px}
dialog::backdrop{background:#0007}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;font-weight:bold;margin-bottom:5px}
.field input,.field textarea,.field select{width:100%;padding:10px;border:1px solid #ddd;border-radius:9px}
.save{width:100%;padding:11px;border:0;border-radius:10px;background:#333;color:white}
.cancel{width:100%;padding:10px;border:1px solid #ddd;border-radius:10px;background:white;margin-top:7px}
@media(max-width:500px){.grid{grid-template-columns:1fr}.toolbar{flex-wrap:wrap}#search{width:100%}}
</style>
</head>

<body>

<header>
<h1>交換管理</h1>
<small>オタ活の交換・取引をまとめて管理</small>

<div class="tabs">
<button class="tab active" onclick="filter('all',this)">すべて</button>
<button class="tab" onclick="filter('active',this)">未完了</button>
<button class="tab" onclick="filter('done',this)">完了</button>
</div>
</header>

<main>

<div class="toolbar">
<input id="search" placeholder="名前・X ID・交換物を検索" oninput="show()">
<button class="add" onclick="openForm()">＋ 交換を追加</button>
</div>

<div id="list"></div>

</main>

<dialog id="formDialog">
<h2 id="formTitle">交換を追加</h2>

<form onsubmit="save(event)">

<input type="hidden" id="editId">

<div class="field">
<label>相手の名前 *</label>
<input id="name" required>
</div>

<div class="field">
<label>X（Twitter）ID</label>
<input id="xid" placeholder="@example">
</div>

<div class="field">
<label>自分が出すもの *</label>
<textarea id="give" rows="2" required></textarea>
</div>

<div class="field">
<label>相手からもらうもの *</label>
<textarea id="want" rows="2" required></textarea>
</div>

<div class="field">
<label>取引方法</label>
<select id="method">
<option>郵送</option>
<option>手渡し</option>
<option>その他</option>
</select>
</div>

<div class="field">
<label>ステータス</label>
<select id="status">
<option>約束済み</option>
<option>発送待ち</option>
<option>発送済み</option>
<option>到着待ち</option>
<option>完了</option>
</select>
</div>

<div class="field">
<label>交換予定日</label>
<input id="date" type="date">
</div>

<div class="field">
<label>イベント・会場</label>
<input id="event">
</div>

<div class="field">
<label>メモ</label>
<textarea id="memo" rows="3"></textarea>
</div>

<button class="save">保存</button>
<button type="button" class="cancel" onclick="formDialog.close()">キャンセル</button>

</form>
</dialog>

<script>

let data=JSON.parse(localStorage.getItem("exchangeData")||"[]");
let current="all";

function saveData(){
localStorage.setItem("exchangeData",JSON.stringify(data));
show();
}

function openForm(item=null){

formDialog.showModal();

formTitle.textContent=item?"交換を編集":"交換を追加";

editId.value=item?.id||"";
name.value=item?.name||"";
xid.value=item?.xid||"";
give.value=item?.give||"";
want.value=item?.want||"";
method.value=item?.method||"郵送";
status.value=item?.status||"約束済み";
date.value=item?.date||"";
event.value=item?.event||"";
memo.value=item?.memo||"";

}

function save(e){

e.preventDefault();

let item={
id:editId.value||Date.now().toString(),
name:name.value,
xid:xid.value,
give:give.value,
want:want.value,
method:method.value,
status:status.value,
date:date.value,
event:event.value,
memo:memo.value
};

let index=data.findIndex(x=>x.id===item.id);

if(index>=0)data[index]=item;
else data.unshift(item);

saveData();
formDialog.close();

}

function edit(id){
let item=data.find(x=>x.id===id);
openForm(item);
}

function remove(id){

if(confirm("この交換を削除しますか？")){
data=data.filter(x=>x.id!==id);
saveData();
}

}

function filter(type,button){

current=type;

document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
button.classList.add("active");

show();

}

function show(){

let q=search.value.toLowerCase();

let list=data.filter(x=>{

let target=[x.name,x.xid,x.give,x.want,x.event,x.memo].join(" ").toLowerCase();

let matchSearch=target.includes(q);

let matchStatus=
current==="all"||
current==="active"&&x.status!=="完了"||
current==="done"&&x.status==="完了";

return matchSearch&&matchStatus;

});

if(!list.length){

document.getElementById("list").innerHTML=
'<div class="empty">交換情報がありません<br><br>「＋ 交換を追加」から登録してね！</div>';

return;

}

document.getElementById("list").innerHTML=list.map(x=>`

<div class="card">

<div class="top">

<div>
<div class="name">${escapeHtml(x.name)}</div>

${x.xid?
`<div class="xid">
<a href="https://x.com/${x.xid.replace("@","")}" target="_blank">
${escapeHtml(x.xid)}
</a>
</div>`:""}

</div>

<div class="badge">${escapeHtml(x.status)}</div>

</div>

<div class="grid">

<div>
<div class="label">自分が出す</div>
<div class="value">${escapeHtml(x.give)}</div>
</div>

<div>
<div class="label">相手からもらう</div>
<div class="value">${escapeHtml(x.want)}</div>
</div>

</div>

<div class="meta">

${x.method?"📦 "+escapeHtml(x.method):""}

${x.date?"　📅 "+escapeHtml(x.date):""}

${x.event?"　📍 "+escapeHtml(x.event):""}

${x.memo?"<br>📝 "+escapeHtml(x.memo):""}

</div>

<div class="actions">

<button onclick="edit('${x.id}')">編集</button>

<button onclick="remove('${x.id}')">削除</button>

</div>

</div>

`).join("");

}

function escapeHtml(text){

return String(text||"")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}

show();

</script>

</body>
</html>
