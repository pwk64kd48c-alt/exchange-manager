<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>交換管理</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f7f7f7;
  color:#444;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
}

header{
  background:#fff;
  border-bottom:1px solid #e8e8e8;
  padding:20px 16px;
  position:sticky;
  top:0;
  z-index:10;
}

main{
  max-width:700px;
  margin:auto;
  padding:16px;
}

h1{
  margin:0;
  font-size:25px;
  letter-spacing:.03em;
}

small{
  color:#999;
}

button,
input,
textarea,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

.tabs{
  display:flex;
  gap:8px;
  margin-top:16px;
}

.tab{
  border:0;
  border-radius:20px;
  padding:9px 15px;
  background:#eee;
  color:#666;
}

.tab.active{
  background:#8f8f8f;
  color:#fff;
}

.toolbar{
  display:flex;
  gap:8px;
  margin-bottom:15px;
}

#search{
  flex:1;
  min-width:0;
  border:1px solid #ddd;
  border-radius:10px;
  padding:11px;
  background:#fff;
}

.add{
  background:#8f8f8f;
  color:#fff;
  border:0;
  border-radius:10px;
  padding:10px 14px;
  white-space:nowrap;
}

.card{
  background:#fff;
  border:1px solid #e8e8e8;
  border-radius:16px;
  padding:15px;
  margin-bottom:12px;
  box-shadow:0 2px 8px rgba(0,0,0,.03);
}

.card-image{
  width:60px;
  height:60px;
  object-fit:cover;
  background:#f5f5f5;
  border-radius:10px;
  display:block;
  margin:14px 0 4px 0;
  cursor:pointer;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:10px;
}

.name{
  font-size:17px;
  font-weight:bold;
}

.xid{
  margin-top:5px;
  font-size:14px;
  font-weight:bold;
}

.xid a{
  color:#666;
  text-decoration:none;
}

.badge{
  font-size:11px;
  background:#eee;
  color:#666;
  border-radius:20px;
  padding:5px 9px;
  white-space:nowrap;
}

.item-type{
  display:inline-block;
  margin-top:15px;
  padding:5px 10px;
  border-radius:20px;
  background:#f0f0f0;
  color:#666;
  font-size:12px;
  font-weight:bold;
}

.characters{
  margin-top:9px;
  font-size:18px;
  font-weight:bold;
  color:#444;
  word-break:break-word;
}

.meta{
  font-size:12px;
  color:#888;
  margin-top:14px;
  line-height:1.8;
}

.actions{
  display:flex;
  gap:7px;
  margin-top:14px;
}

.actions button{
  flex:1;
  border:1px solid #ddd;
  background:#fff;
  color:#666;
  border-radius:8px;
  padding:8px;
}

.empty{
  text-align:center;
  color:#999;
  padding:50px 10px;
}

dialog{
  border:0;
  border-radius:18px;
  width:calc(100% - 24px);
  max-width:650px;
  padding:20px;
  box-shadow:0 10px 40px rgba(0,0,0,.15);
}

dialog::backdrop{
  background:rgba(0,0,0,.45);
}

.field{
  margin-bottom:13px;
}

.field label{
  display:block;
  font-size:12px;
  font-weight:bold;
  margin-bottom:5px;
  color:#666;
}

.field input,
.field textarea,
.field select{
  width:100%;
  padding:10px;
  border:1px solid #ddd;
  border-radius:9px;
  background:#fff;
  color:#444;
}

.field input:focus,
.field textarea:focus,
.field select:focus{
  outline:none;
  border-color:#aaa;
}

.image-preview{
  width:100%;
  max-height:220px;
  object-fit:contain;
  background:#f5f5f5;
  border-radius:10px;
  margin-top:8px;
  display:none;
}

.image-buttons{
  margin-top:8px;
}

.image-buttons button{
  width:100%;
  padding:8px;
  border:1px solid #ddd;
  background:#fff;
  border-radius:8px;
  color:#777;
}

.photo-note{
  font-size:11px;
  color:#999;
  margin-top:5px;
  line-height:1.5;
}

.save{
  width:100%;
  padding:11px;
  border:0;
  border-radius:10px;
  background:#8f8f8f;
  color:#fff;
}

.cancel{
  width:100%;
  padding:10px;
  border:1px solid #ddd;
  border-radius:10px;
  background:#fff;
  color:#666;
  margin-top:7px;
}

.lightbox{
  width:calc(100% - 24px);
  max-width:900px;
  padding:10px;
  background:transparent;
  box-shadow:none;
}

.lightbox::backdrop{
  background:rgba(0,0,0,.75);
}

.lightbox img{
  width:100%;
  max-height:85vh;
  object-fit:contain;
  border-radius:10px;
}

.close-photo{
  position:absolute;
  top:-5px;
  right:0;
  border:0;
  background:#fff;
  width:35px;
  height:35px;
  border-radius:50%;
  font-size:20px;
}

@media(max-width:500px){

  .toolbar{
    flex-wrap:wrap;
  }

  #search{
    width:100%;
    flex-basis:100%;
  }

  .add{
    width:100%;
  }

  .characters{
    font-size:17px;
  }
}
</style>
</head>

<body>

<header>

  <h1>交換管理</h1>

  <small>
    交換・取引をまとめて管理
  </small>

  <div class="tabs">

    <button class="tab active" id="allTab">
      すべて
    </button>

    <button class="tab" id="activeTab">
      未完了
    </button>

    <button class="tab" id="doneTab">
      完了
    </button>

  </div>

</header>

<main>

  <div class="toolbar">

    <input
      id="search"
      placeholder="名前・X ID・交換内容・キャラを検索"
    >

    <button class="add" id="addButton">
      ＋ 交換を追加
    </button>

  </div>

  <div id="list"></div>

</main>


<!-- 追加・編集 -->

<dialog id="formDialog">

  <h2 id="formTitle">交換を追加</h2>

  <form id="exchangeForm">

    <input
      type="hidden"
      id="editId"
    >

    <div class="field">

      <label>交換内容 *</label>

      <select id="itemType">

        <option value="ぱしゃっつ">ぱしゃっつ</option>
        <option value="缶バッジ">缶バッジ</option>
        <option value="アクリルスタンド">アクリルスタンド</option>
        <option value="チェキ">チェキ</option>
        <option value="カード">カード</option>
        <option value="ぬいぐるみ">ぬいぐるみ</option>
        <option value="その他">その他</option>

      </select>

    </div>


    <div
      class="field"
      id="otherField"
      style="display:none;"
    >

      <label>交換内容を入力 *</label>

      <input
        id="otherItem"
        placeholder="例：クリアファイル"
      >

    </div>


    <div class="field">

      <label>交換内容の画像</label>

      <input
        id="image"
        type="file"
        accept="image/*"
      >

      <div class="photo-note">
        この「交換内容」の画像を1枚登録できます。<br>
        ぱしゃっつなら、ぱしゃっつの交換すべてに同じ画像が表示されます。
      </div>

      <img
        id="imagePreview"
        class="image-preview"
      >

      <div class="image-buttons">

        <button
          type="button"
          id="removeImageButton"
        >
          この交換内容の画像を削除
        </button>

      </div>

    </div>


    <div class="field">

      <label>交換するもの *</label>

      <input
        id="characters"
        required
        placeholder="𓏸𓏸 ↔ 𓏸𓏸"
      >

    </div>


    <div class="field">

      <label>相手の名前 *</label>

      <input
        id="name"
        required
      >

    </div>


    <div class="field">

      <label>X ID</label>

      <input
        id="xid"
        placeholder="@example"
      >

    </div>


    <div class="field">

      <label>取引方法</label>

      <select id="method">

        <option value="郵送">郵送</option>
        <option value="手渡し">手渡し</option>
        <option value="その他">その他</option>

      </select>

    </div>


    <div class="field">

      <label>ステータス</label>

      <select id="status">

        <option value="約束済み">約束済み</option>
        <option value="発送待ち">発送待ち</option>
        <option value="発送済み">発送済み</option>
        <option value="到着待ち">到着待ち</option>
        <option value="完了">完了</option>

      </select>

    </div>


    <div class="field">

      <label>交換予定日</label>

      <input
        id="date"
        type="date"
      >

    </div>


    <div class="field">

      <label>イベント・会場</label>

      <input id="event">

    </div>


    <div class="field">

      <label>メモ</label>

      <textarea
        id="memo"
        rows="3"
      ></textarea>

    </div>


    <button
      type="submit"
      class="save"
    >
      保存
    </button>


    <button
      type="button"
      class="cancel"
      id="cancelButton"
    >
      キャンセル
    </button>

  </form>

</dialog>


<!-- 画像拡大 -->

<dialog
  id="photoDialog"
  class="lightbox"
>

  <button
    type="button"
    class="close-photo"
    id="closePhotoButton"
  >
    ×
  </button>

  <img id="largePhoto">

</dialog>


<script>

const STORAGE_KEY = "exchangeData";
const IMAGE_STORAGE_KEY = "categoryImages";

let data = [];
let categoryImages = {};
let currentFilter = "all";
let currentImage = "";
let currentImageType = "";


/* =========================
   DOM
========================= */

const formDialog =
  document.getElementById("formDialog");

const photoDialog =
  document.getElementById("photoDialog");

const exchangeForm =
  document.getElementById("exchangeForm");

const formTitle =
  document.getElementById("formTitle");

const editId =
  document.getElementById("editId");

const itemType =
  document.getElementById("itemType");

const otherField =
  document.getElementById("otherField");

const otherItem =
  document.getElementById("otherItem");

const imageInput =
  document.getElementById("image");

const imagePreview =
  document.getElementById("imagePreview");

const charactersInput =
  document.getElementById("characters");

const nameInput =
  document.getElementById("name");

const xidInput =
  document.getElementById("xid");

const methodInput =
  document.getElementById("method");

const statusInput =
  document.getElementById("status");

const dateInput =
  document.getElementById("date");

const eventInput =
  document.getElementById("event");

const memoInput =
  document.getElementById("memo");

const searchInput =
  document.getElementById("search");

const listElement =
  document.getElementById("list");


/* =========================
   データ読み込み
========================= */

try{

  data = JSON.parse(
    localStorage.getItem(STORAGE_KEY) || "[]"
  );

  if(!Array.isArray(data)){
    data = [];
  }

}catch(error){

  data = [];

}


try{

  categoryImages = JSON.parse(
    localStorage.getItem(IMAGE_STORAGE_KEY) || "{}"
  );

  if(
    !categoryImages ||
    typeof categoryImages !== "object"
  ){
    categoryImages = {};
  }

}catch(error){

  categoryImages = {};

}


/* =========================
   古い画像を新仕様へ移行
========================= */

let imageMigrationNeeded = false;

data.forEach(function(item){

  if(
    item.image &&
    item.itemType &&
    !categoryImages[item.itemType]
  ){

    categoryImages[item.itemType] =
      item.image;

    imageMigrationNeeded = true;

  }

});


if(imageMigrationNeeded){

  try{

    localStorage.setItem(
      IMAGE_STORAGE_KEY,
      JSON.stringify(categoryImages)
    );

  }catch(error){}

}


/* =========================
   画像カテゴリ名
========================= */

function getItemType(){

  if(itemType.value === "その他"){

    return otherItem.value.trim();

  }

  return itemType.value;

}


/* =========================
   画像保存
========================= */

function saveCategoryImages(){

  try{

    localStorage.setItem(
      IMAGE_STORAGE_KEY,
      JSON.stringify(categoryImages)
    );

    return true;

  }catch(error){

    alert(
      "画像を保存できませんでした。\n画像の容量が大きすぎる可能性があります。"
    );

    return false;

  }

}


/* =========================
   データ保存
========================= */

function saveData(){

  try{

    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(data)
    );

    return true;

  }catch(error){

    alert(
      "保存できませんでした。\n画像の容量が大きすぎる可能性があります。"
    );

    return false;

  }

}


/* =========================
   画像圧縮
========================= */

function compressImage(file){

  return new Promise(function(resolve,reject){

    const reader =
      new FileReader();

    reader.onload = function(event){

      const img =
        new Image();

      img.onload = function(){

        const maxSize = 900;

        let width = img.width;
        let height = img.height;


        if(
          width > maxSize ||
          height > maxSize
        ){

          if(width >= height){

            height =
              Math.round(
                height * maxSize / width
              );

            width = maxSize;

          }else{

            width =
              Math.round(
                width * maxSize / height
              );

            height = maxSize;

          }

        }


        const canvas =
          document.createElement("canvas");

        canvas.width = width;
        canvas.height = height;


        const ctx =
          canvas.getContext("2d");

        ctx.drawImage(
          img,
          0,
          0,
          width,
          height
        );


        resolve(
          canvas.toDataURL(
            "image/jpeg",
            0.7
          )
        );

      };


      img.onerror = function(){

        reject(
          new Error("画像読み込みエラー")
        );

      };


      img.src =
        event.target.result;

    };


    reader.onerror = function(){

      reject(
        new Error("ファイル読み込みエラー")
      );

    };


    reader.readAsDataURL(file);

  });

}


/* =========================
   画像選択
========================= */

imageInput.addEventListener(
  "change",
  async function(){

    const file =
      imageInput.files[0];

    if(!file){
      return;
    }


    const selectedType =
      getItemType();


    if(!selectedType){

      alert(
        "先に交換内容を選んでね！"
      );

      imageInput.value = "";

      return;

    }


    try{

      const compressed =
        await compressImage(file);

      currentImage =
        compressed;

      currentImageType =
        selectedType;

      imagePreview.src =
        currentImage;

      imagePreview.style.display =
        "block";

    }catch(error){

      alert(
        "画像を読み込めませんでした。"
      );

    }

  }
);


/* =========================
   交換内容変更
========================= */

itemType.addEventListener(
  "change",
  function(){

    updateOtherField();

    const selectedType =
      getItemType();

    currentImageType =
      selectedType;

    currentImage =
      categoryImages[selectedType] || "";

    if(currentImage){

      imagePreview.src =
        currentImage;

      imagePreview.style.display =
        "block";

    }else{

      imagePreview.src = "";

      imagePreview.style.display =
        "none";

    }

  }
);


/* =========================
   その他変更
========================= */

otherItem.addEventListener(
  "input",
  function(){

    if(itemType.value !== "その他"){
      return;
    }

    const selectedType =
      otherItem.value.trim();

    currentImageType =
      selectedType;

    currentImage =
      categoryImages[selectedType] || "";

    if(currentImage){

      imagePreview.src =
        currentImage;

      imagePreview.style.display =
        "block";

    }else{

      imagePreview.src = "";

      imagePreview.style.display =
        "none";

    }

  }
);


/* =========================
   画像削除
========================= */

document
  .getElementById("removeImageButton")
  .addEventListener(
    "click",
    function(){

      const selectedType =
        currentImageType ||
        getItemType();


      if(selectedType){

        delete categoryImages[selectedType];

        saveCategoryImages();

      }


      currentImage = "";

      currentImageType = "";

      imageInput.value = "";

      imagePreview.src = "";

      imagePreview.style.display =
        "none";

      show();

    }
  );


/* =========================
   その他
========================= */

function updateOtherField(){

  if(
    itemType.value === "その他"
  ){

    otherField.style.display =
      "block";

    otherItem.required = true;

  }else{

    otherField.style.display =
      "none";

    otherItem.required = false;

  }

}


/* =========================
   フォームを開く
========================= */

function openForm(item = null){

  formTitle.textContent =
    item
      ? "交換を編集"
      : "交換を追加";


  editId.value =
    item?.id || "";


  nameInput.value =
    item?.name || "";


  xidInput.value =
    item?.xid || "";


  charactersInput.value =
    item?.characters || "";


  const standardItems = [
    "ぱしゃっつ",
    "缶バッジ",
    "アクリルスタンド",
    "チェキ",
    "カード",
    "ぬいぐるみ"
  ];


  if(
    item &&
    item.itemType &&
    !standardItems.includes(
      item.itemType
    )
  ){

    itemType.value =
      "その他";

    otherItem.value =
      item.itemType;

  }else{

    itemType.value =
      item?.itemType ||
      "ぱしゃっつ";

    otherItem.value =
      "";

  }


  updateOtherField();


  methodInput.value =
    item?.method ||
    "郵送";


  statusInput.value =
    item?.status ||
    "約束済み";


  dateInput.value =
    item?.date ||
    "";


  eventInput.value =
    item?.event ||
    "";


  memoInput.value =
    item?.memo ||
    "";


  currentImageType =
    item?.itemType ||
    itemType.value;


  currentImage =
    categoryImages[currentImageType] ||
    "";


  if(currentImage){

    imagePreview.src =
      currentImage;

    imagePreview.style.display =
      "block";

  }else{

    imagePreview.src = "";

    imagePreview.style.display =
      "none";

  }


  imageInput.value = "";


  formDialog.showModal();

}


/* =========================
   新規追加
========================= */

document
  .getElementById("addButton")
  .addEventListener(
    "click",
    function(){

      openForm();

    }
  );


/* =========================
   キャンセル
========================= */

document
  .getElementById("cancelButton")
  .addEventListener(
    "click",
    function(){

      formDialog.close();

    }
  );


/* =========================
   保存
========================= */

exchangeForm.addEventListener(
  "submit",
  async function(event){

    event.preventDefault();


    const selectedType =
      getItemType();


    if(!selectedType){

      alert(
        "交換内容を入力してね！"
      );

      return;

    }


    const characterText =
      charactersInput.value.trim();


    const partnerName =
      nameInput.value.trim();


    if(!characterText){

      alert(
        "交換するものを入力してね！"
      );

      charactersInput.focus();

      return;

    }


    if(!partnerName){

      alert(
        "相手の名前を入力してね！"
      );

      nameInput.focus();

      return;

    }


    /*
      新しい画像が選ばれていたら
      この交換内容の画像として保存
    */

    if(
      currentImage &&
      currentImageType === selectedType
    ){

      categoryImages[selectedType] =
        currentImage;

      if(!saveCategoryImages()){

        return;

      }

    }


    const newItem = {

      id:
        editId.value ||
        Date.now().toString(),

      itemType:
        selectedType,

      characters:
        characterText,

      name:
        partnerName,

      xid:
        xidInput.value.trim(),

      method:
        methodInput.value,

      status:
        statusInput.value,

      date:
        dateInput.value,

      event:
        eventInput.value.trim(),

      memo:
        memoInput.value.trim()

    };


    const existingIndex =
      data.findIndex(
        function(item){

          return item.id ===
            newItem.id;

        }
      );


    if(existingIndex >= 0){

      data[existingIndex] =
        newItem;

    }else{

      data.unshift(
        newItem
      );

    }


    if(saveData()){

      formDialog.close();

      exchangeForm.reset();

      currentImage = "";

      currentImageType = "";

      imagePreview.src = "";

      imagePreview.style.display =
        "none";

      updateOtherField();

      show();

    }

  }
);


/* =========================
   編集
========================= */

function editItem(id){

  const item =
    data.find(
      function(x){

        return x.id === id;

      }
    );


  if(item){

    openForm(item);

  }

}


/* =========================
   削除
========================= */

function deleteItem(id){

  if(
    !confirm(
      "この交換を削除しますか？"
    )
  ){

    return;

  }


  data =
    data.filter(
      function(item){

        return item.id !== id;

      }
    );


  saveData();

  show();

}


/* =========================
   フィルター
========================= */

function setFilter(type){

  currentFilter = type;


  document
    .querySelectorAll(".tab")
    .forEach(
      function(button){

        button.classList.remove(
          "active"
        );

      }
    );


  if(type === "all"){

    document
      .getElementById("allTab")
      .classList.add("active");

  }


  if(type === "active"){

    document
      .getElementById("activeTab")
      .classList.add("active");

  }


  if(type === "done"){

    document
      .getElementById("doneTab")
      .classList.add("active");

  }


  show();

}


document
  .getElementById("allTab")
  .addEventListener(
    "click",
    function(){

      setFilter("all");

    }
  );


document
  .getElementById("activeTab")
  .addEventListener(
    "click",
    function(){

      setFilter("active");

    }
  );


document
  .getElementById("doneTab")
  .addEventListener(
    "click",
    function(){

      setFilter("done");

    }
  );


/* =========================
   検索
========================= */

searchInput.addEventListener(
  "input",
  show
);


/* =========================
   画像拡大
========================= */

function openPhoto(src){

  document
    .getElementById("largePhoto")
    .src = src;

  photoDialog.showModal();

}


document
  .getElementById("closePhotoButton")
  .addEventListener(
    "click",
    function(){

      photoDialog.close();

    }
  );


/* =========================
   表示
========================= */

function show(){

  const keyword =
    searchInput.value
      .toLowerCase()
      .trim();


  const filtered =
    data.filter(
      function(item){

        const searchText = [

          item.name,

          item.xid,

          item.itemType,

          item.characters,

          item.event,

          item.memo

        ]
          .join(" ")
          .toLowerCase();


        const matchesSearch =
          searchText.includes(
            keyword
          );


        let matchesFilter =
          true;


        if(
          currentFilter === "active"
        ){

          matchesFilter =
            item.status !== "完了";

        }


        if(
          currentFilter === "done"
        ){

          matchesFilter =
            item.status === "完了";

        }


        return (
          matchesSearch &&
          matchesFilter
        );

      }
    );


  if(filtered.length === 0){

    listElement.innerHTML = `
      <div class="empty">
        交換情報がありません
        <br><br>
        「＋ 交換を追加」から登録してね！
      </div>
    `;

    return;

  }


  listElement.innerHTML =
    filtered
      .map(
        function(item){

          const categoryImage =
            categoryImages[item.itemType] ||
            "";


          const imageHtml =
            categoryImage
              ? `
                <img
                  class="card-image"
                  src="${categoryImage}"
                  data-photo="${encodeURIComponent(categoryImage)}"
                >
              `
              : "";


          const xidHtml =
            item.xid
              ? `
                <div class="xid">
                  <a
                    href="https://x.com/${encodeURIComponent(
                      item.xid.replace(/^@/,"")
                    )}"
                    target="_blank"
                    rel="noopener noreferrer"
                  >
                    ${escapeHtml(item.xid)}
                  </a>
                </div>
              `
              : "";


          const metaParts = [];


          if(item.method){

            metaParts.push(
              "📦 " +
              escapeHtml(
                item.method
              )
            );

          }


          if(item.date){

            metaParts.push(
              "📅 " +
              escapeHtml(
                item.date
              )
            );

          }


          let metaHtml =
            metaParts.join("　");


          if(item.event){

            metaHtml +=
              "<br>📍 " +
              escapeHtml(
                item.event
              );

          }


          if(item.memo){

            metaHtml +=
              "<br>📝 " +
              escapeHtml(
                item.memo
              );

          }


          return `

            <div class="card">

              ${imageHtml}

              <div class="top">

                <div>

                  <div class="name">
                    ${escapeHtml(
                      item.name
                    )}
                  </div>

                  ${xidHtml}

                </div>

                <div class="badge">
                  ${escapeHtml(
                    item.status
                  )}
                </div>

              </div>


              <div class="item-type">
                ${escapeHtml(
                  item.itemType
                )}
              </div>


              <div class="characters">
                ${escapeHtml(
                  item.characters
                )}
              </div>


              ${
                metaHtml
                  ? `
                    <div class="meta">
                      ${metaHtml}
                    </div>
                  `
                  : ""
              }


              <div class="actions">

                <button
                  type="button"
                  data-edit="${escapeHtml(item.id)}"
                >
                  編集
                </button>

                <button
                  type="button"
                  data-delete="${escapeHtml(item.id)}"
                >
                  削除
                </button>

              </div>

            </div>

          `;

        }
      )
      .join("");


  /* 編集 */

  listElement
    .querySelectorAll("[data-edit]")
    .forEach(
      function(button){

        button.addEventListener(
          "click",
          function(){

            editItem(
              button.dataset.edit
            );

          }
        );

      }
    );


  /* 削除 */

  listElement
    .querySelectorAll("[data-delete]")
    .forEach(
      function(button){

        button.addEventListener(
          "click",
          function(){

            deleteItem(
              button.dataset.delete
            );

          }
        );

      }
    );


  /* 画像 */

  listElement
    .querySelectorAll("[data-photo]")
    .forEach(
      function(image){

        image.addEventListener(
          "click",
          function(){

            openPhoto(
              decodeURIComponent(
                image.dataset.photo
              )
            );

          }
        );

      }
    );

}


/* =========================
   HTML対策
========================= */

function escapeHtml(text){

  return String(
    text || ""
  )
    .replaceAll(
      "&",
      "&amp;"
    )
    .replaceAll(
      "<",
      "&lt;"
    )
    .replaceAll(
      ">",
      "&gt;"
    )
    .replaceAll(
      '"',
      "&quot;"
    )
    .replaceAll(
      "'",
      "&#039;"
    );

}


/* =========================
   初期表示
========================= */

show();

</script>

</body>
</html>
