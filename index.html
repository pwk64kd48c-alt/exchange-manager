<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>交換管理</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#f7f7f7;
  color:#444;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
}

header{
  background:#fff;
  border-bottom:1px solid #e8e8e8;
  padding:20px 16px;
  position:sticky;
  top:0;
  z-index:10;
}

main{
  max-width:700px;
  margin:auto;
  padding:16px;
}

h1{
  margin:0;
  font-size:25px;
  letter-spacing:.03em;
}

small{
  color:#999;
}

button,input,textarea,select{
  font:inherit;
}

button{
  cursor:pointer;
}

.tabs{
  display:flex;
  gap:8px;
  margin-top:16px;
}

.tab{
  border:0;
  border-radius:20px;
  padding:9px 15px;
  background:#eeeeee;
  color:#666;
}

.tab.active{
  background:#8f8f8f;
  color:white;
}

.toolbar{
  display:flex;
  gap:8px;
  margin-bottom:15px;
}

#search{
  flex:1;
  border:1px solid #ddd;
  border-radius:10px;
  padding:11px;
  background:white;
  min-width:0;
}

.add{
  background:#8f8f8f;
  color:white;
  border:0;
  border-radius:10px;
  padding:10px 14px;
  white-space:nowrap;
}

.card{
  background:white;
  border:1px solid #e8e8e8;
  border-radius:16px;
  padding:15px;
  margin-bottom:12px;
  box-shadow:0 2px 8px rgba(0,0,0,.03);
}

.card-image{
  width:100%;
  max-height:330px;
  object-fit:contain;
  background:#f5f5f5;
  border-radius:12px;
  display:block;
  margin-bottom:14px;
  cursor:pointer;
}

.top{
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:flex-start;
}

.name{
  font-weight:bold;
  font-size:17px;
}

.xid{
  margin-top:5px;
  font-size:14px;
  font-weight:bold;
}

.xid a{
  color:#666;
  text-decoration:none;
}

.xid a:hover{
  text-decoration:underline;
}

.badge{
  font-size:11px;
  background:#eeeeee;
  color:#666;
  border-radius:20px;
  padding:5px 9px;
  white-space:nowrap;
}

.item-type{
  display:inline-block;
  margin-top:15px;
  padding:5px 10px;
  border-radius:20px;
  background:#f0f0f0;
  color:#666;
  font-size:12px;
  font-weight:bold;
}

.characters{
  margin-top:9px;
  font-size:18px;
  font-weight:bold;
  color:#444;
  word-break:break-word;
}

.meta{
  font-size:12px;
  color:#888;
  margin-top:14px;
  line-height:1.8;
}

.actions{
  display:flex;
  gap:7px;
  margin-top:14px;
}

.actions button{
  flex:1;
  border:1px solid #ddd;
  background:white;
  color:#666;
  border-radius:8px;
  padding:8px;
}

.empty{
  text-align:center;
  color:#999;
  padding:50px 10px;
}

dialog{
  border:0;
  border-radius:18px;
  width:calc(100% - 24px);
  max-width:650px;
  padding:20px;
  box-shadow:0 10px 40px rgba(0,0,0,.15);
}

dialog::backdrop{
  background:rgba(0,0,0,.45);
}

.field{
  margin-bottom:13px;
}

.field label{
  display:block;
  font-size:12px;
  font-weight:bold;
  margin-bottom:5px;
  color:#666;
}

.field input,
.field textarea,
.field select{
  width:100%;
  padding:10px;
  border:1px solid #ddd;
  border-radius:9px;
  background:white;
  color:#444;
}

.field input:focus,
.field textarea:focus,
.field select:focus{
  outline:none;
  border-color:#aaa;
}

.image-preview{
  width:100%;
  max-height:220px;
  object-fit:contain;
  background:#f5f5f5;
  border-radius:10px;
  margin-top:8px;
  display:none;
}

.image-buttons{
  display:flex;
  gap:7px;
  margin-top:8px;
}

.image-buttons button{
  flex:1;
  padding:8px;
  border:1px solid #ddd;
  background:white;
  border-radius:8px;
  color:#777;
}

.save{
  width:100%;
  padding:11px;
  border:0;
  border-radius:10px;
  background:#8f8f8f;
  color:white;
}

.cancel{
  width:100%;
  padding:10px;
  border:1px solid #ddd;
  border-radius:10px;
  background:white;
  color:#666;
  margin-top:7px;
}

.photo-note{
  font-size:11px;
  color:#999;
  margin-top:5px;
  line-height:1.5;
}

.lightbox{
  width:calc(100% - 24px);
  max-width:900px;
  padding:10px;
  background:transparent;
  box-shadow:none;
}

.lightbox::backdrop{
  background:rgba(0,0,0,.75);
}

.lightbox img{
  width:100%;
  max-height:85vh;
  object-fit:contain;
  border-radius:10px;
}

.close-photo{
  position:absolute;
  top:-5px;
  right:0;
  border:0;
  background:white;
  width:35px;
  height:35px;
  border-radius:50%;
  font-size:20px;
}

@media(max-width:500px){
  .toolbar{
    flex-wrap:wrap;
  }

  #search{
    width:100%;
    flex-basis:100%;
  }

  .add{
    width:100%;
  }

  .characters{
    font-size:17px;
  }
}
</style>
</head>

<body>

<header>
  <h1>交換管理</h1>
  <small>オタ活の交換・取引をまとめて管理</small>

  <div class="tabs">
    <button class="tab active" onclick="filter('all',this)">すべて</button>
    <button class="tab" onclick="filter('active',this)">未完了</button>
    <button class="tab" onclick="filter('done',this)">完了</button>
  </div>
</header>

<main>

  <div class="toolbar">
    <input
      id="search"
      placeholder="名前・X ID・交換内容・キャラを検索"
      oninput="show()"
    >
    <button class="add" onclick="openForm()">＋ 交換を追加</button>
  </div>

  <div id="list"></div>

</main>

<!-- 交換追加・編集 -->

<dialog id="formDialog">

  <h2 id="formTitle">交換を追加</h2>

  <form onsubmit="save(event)">

    <input type="hidden" id="editId">

    <div class="field">
      <label>交換内容 *</label>

      <select id="itemType" onchange="toggleOther()">
        <option value="ぱしゃっつ">ぱしゃっつ</option>
        <option value="缶バッジ">缶バッジ</option>
        <option value="アクリルスタンド">アクリルスタンド</option>
        <option value="チェキ">チェキ</option>
        <option value="カード">カード</option>
        <option value="ぬいぐるみ">ぬいぐるみ</option>
        <option value="その他">その他</option>
      </select>
    </div>

    <div class="field" id="otherField" style="display:none;">
      <label>交換内容を入力 *</label>
      <input id="otherItem" placeholder="例：クリアファイル">
    </div>

    <div class="field">
      <label>交換内容の画像</label>

      <input
        id="image"
        type="file"
        accept="image/*"
        onchange="previewImage(event)"
      >

      <div class="photo-note">
        この交換に関する画像を1枚入れられます。<br>
        画像は自動で小さくして保存します。
      </div>

      <img id="imagePreview" class="image-preview">

      <div class="image-buttons">
        <button type="button" onclick="removeImage()">画像を削除</button>
      </div>
    </div>

    <div class="field">
      <label>交換内容 *</label>
      <input
        id="characters"
        required
        placeholder="例：月永レオ ↔ 皇れお"
      >
    </div>

    <div class="field">
      <label>相手の名前 *</label>
      <input id="name" required>
    </div>

    <div class="field">
      <label>X ID</label>
      <input id="xid" placeholder="@example">
    </div>

    <div class="field">
      <label>取引方法</label>
      <select id="method">
        <option>郵送</option>
        <option>手渡し</option>
        <option>その他</option>
      </select>
    </div>

    <div class="field">
      <label>ステータス</label>
      <select id="status">
        <option>約束済み</option>
        <option>発送待ち</option>
        <option>発送済み</option>
        <option>到着待ち</option>
        <option>完了</option>
      </select>
    </div>

    <div class="field">
      <label>交換予定日</label>
      <input id="date" type="date">
    </div>

    <div class="field">
      <label>イベント・会場</label>
      <input id="event">
    </div>

    <div class="field">
      <label>メモ</label>
      <textarea id="memo" rows="3"></textarea>
    </div>

    <button class="save">保存</button>

    <button
      type="button"
      class="cancel"
      onclick="formDialog.close()"
    >
      キャンセル
    </button>

  </form>
</dialog>


<!-- 画像拡大 -->

<dialog id="photoDialog" class="lightbox">

  <button
    class="close-photo"
    onclick="photoDialog.close()"
  >
    ×
  </button>

  <img id="largePhoto">

</dialog>


<script>

/* =========================
   データ
========================= */

let data = JSON.parse(
  localStorage.getItem("exchangeData") || "[]"
);

let current = "all";
let currentImage = "";


/* =========================
   データ保存
========================= */

function saveData(){
  try{
    localStorage.setItem(
      "exchangeData",
      JSON.stringify(data)
    );
    show();
  }catch(e){
    alert(
      "画像が大きすぎて保存できませんでした。\n別の画像を試してみてね。"
    );
  }
}


/* =========================
   その他の表示
========================= */

function toggleOther(){

  if(itemType.value === "その他"){
    otherField.style.display = "block";
    otherItem.required = true;
  }else{
    otherField.style.display = "none";
    otherItem.required = false;
    otherItem.value = "";
  }

}


/* =========================
   画像を小さくする
========================= */

function compressImage(file){

  return new Promise((resolve,reject)=>{

    const reader = new FileReader();

    reader.onload = function(e){

      const img = new Image();

      img.onload = function(){

        const maxSize = 900;

        let width = img.width;
        let height = img.height;

        if(width > maxSize || height > maxSize){

          if(width > height){
            height = Math.round(height * maxSize / width);
            width = maxSize;
          }else{
            width = Math.round(width * maxSize / height);
            height = maxSize;
          }

        }

        const canvas = document.createElement("canvas");

        canvas.width = width;
        canvas.height = height;

        const ctx = canvas.getContext("2d");

        ctx.drawImage(
          img,
          0,
          0,
          width,
          height
        );

        resolve(
          canvas.toDataURL("image/jpeg",0.75)
        );

      };

      img.onerror = reject;

      img.src = e.target.result;

    };

    reader.onerror = reject;

    reader.readAsDataURL(file);

  });

}


/* =========================
   画像プレビュー
========================= */

async function previewImage(event){

  const file = event.target.files[0];

  if(!file)return;

  try{

    currentImage = await compressImage(file);

    imagePreview.src = currentImage;
    imagePreview.style.display = "block";

  }catch(e){

    alert("画像を読み込めませんでした。");

  }

}


/* =========================
   画像削除
========================= */

function removeImage(){

  currentImage = "";

  image.value = "";

  imagePreview.src = "";

  imagePreview.style.display = "none";

}


/* =========================
   フォームを開く
========================= */

function openForm(item=null){

  formDialog.showModal();

  formTitle.textContent =
    item ? "交換を編集" : "交換を追加";

  editId.value = item?.id || "";

  name.value = item?.name || "";

  xid.value = item?.xid || "";

  characters.value =
    item?.characters ||
    (item?.give || item?.want
      ? `${item?.give || ""} ↔ ${item?.want || ""}`
      : "");

  itemType.value =
    item?.itemType || "ぱしゃっつ";

  if(
    item &&
    item.itemType &&
    ![
      "ぱしゃっつ",
      "缶バッジ",
      "アクリルスタンド",
      "チェキ",
      "カード",
      "ぬいぐるみ"
    ].includes(item.itemType)
  ){

    itemType.value = "その他";
    otherItem.value = item.itemType;
  }else{

    otherItem.value = "";

  }

  toggleOther();

  method.value =
    item?.method || "郵送";

  status.value =
    item?.status || "約束済み";

  date.value =
    item?.date || "";

  event.value =
    item?.event || "";

  memo.value =
    item?.memo || "";

  currentImage =
    item?.image || "";

  if(currentImage){

    imagePreview.src = currentImage;
    imagePreview.style.display = "block";

  }else{

    imagePreview.src = "";
    imagePreview.style.display = "none";

  }

  image.value = "";

}


/* =========================
   保存
========================= */

async function save(e){

  e.preventDefault();

  let selectedItem =
    itemType.value === "その他"
      ? otherItem.value.trim()
      : itemType.value;

  if(!selectedItem){

    alert("交換内容を入力してね！");
    return;

  }


  let item = {

    id:
      editId.value ||
      Date.now().toString(),

    itemType:
      selectedItem,

    characters:
      characters.value.trim(),

    name:
      name.value.trim(),

    xid:
      xid.value.trim(),

    image:
      currentImage,

    method:
      method.value,

    status:
      status.value,

    date:
      date.value,

    event:
      event.value.trim(),

    memo:
      memo.value.trim()

  };


  let index =
    data.findIndex(
      x => x.id === item.id
    );


  if(index >= 0){

    data[index] = item;

  }else{

    data.unshift(item);

  }


  saveData();

  formDialog.close();

}


/* =========================
   編集
========================= */

function edit(id){

  let item =
    data.find(
      x => x.id === id
    );

  if(item){
    openForm(item);
  }

}


/* =========================
   削除
========================= */

function remove(id){

  if(
    confirm("この交換を削除しますか？")
  ){

    data =
      data.filter(
        x => x.id !== id
      );

    saveData();

  }

}


/* =========================
   タブ
========================= */

function filter(type,button){

  current = type;

  document
    .querySelectorAll(".tab")
    .forEach(
      x => x.classList.remove("active")
    );

  button.classList.add("active");

  show();

}


/* =========================
   画像拡大
========================= */

function openPhoto(src){

  largePhoto.src = src;

  photoDialog.showModal();

}


/* =========================
   表示
========================= */

function show(){

  let q =
    search.value
      .toLowerCase()
      .trim();


  let list =
    data.filter(x => {

      let target = [

        x.name,

        x.xid,

        x.itemType,

        x.characters,

        x.give,

        x.want,

        x.event,

        x.memo

      ]
      .join(" ")
      .toLowerCase();


      let matchSearch =
        target.includes(q);


      let matchStatus =
        current === "all" ||

        current === "active"
          && x.status !== "完了" ||

        current === "done"
          && x.status === "完了";


      return matchSearch && matchStatus;

    });


  if(!list.length){

    document.getElementById("list").innerHTML =

      '<div class="empty">' +
      '交換情報がありません<br><br>' +
      '「＋ 交換を追加」から登録してね！' +
      '</div>';

    return;

  }


  document.getElementById("list").innerHTML =

    list.map(x => `

      <div class="card">

        ${
          x.image
          ?
          `
          <img
            class="card-image"
            src="${x.image}"
            onclick="openPhoto('${x.image}')"
          >
          `
          :
          ""
        }


        <div class="top">

          <div>

            <div class="name">
              ${escapeHtml(x.name)}
            </div>

            ${
              x.xid
              ?
              `
              <div class="xid">
                <a
                  href="https://x.com/${encodeURIComponent(
                    x.xid.replace("@","")
                  )}"
                  target="_blank"
                  rel="noopener"
                >
                  ${escapeHtml(x.xid)}
                </a>
              </div>
              `
              :
              ""
            }

          </div>


          <div class="badge">
            ${escapeHtml(x.status)}
          </div>

        </div>


        <div class="item-type">
          ${escapeHtml(
            x.itemType ||
            (
              x.give
              ? "交換内容"
              : ""
            )
          )}
        </div>


        <div class="characters">

          ${escapeHtml(
            x.characters ||
            (
              x.give || x.want
              ?
              `${x.give || ""} ↔ ${x.want || ""}`
              :
              ""
            )
          )}

        </div>


        <div class="meta">

          ${
            x.method
            ? "📦 " + escapeHtml(x.method)
            : ""
          }

          ${
            x.date
            ? "　📅 " + escapeHtml(x.date)
            : ""
          }

          ${
            x.event
            ? "<br>📍 " + escapeHtml(x.event)
            : ""
          }

          ${
            x.memo
            ? "<br>📝 " + escapeHtml(x.memo)
            : ""
          }

        </div>


        <div class="actions">

          <button
            onclick="edit('${x.id}')"
          >
            編集
          </button>

          <button
            onclick="remove('${x.id}')"
          >
            削除
          </button>

        </div>

      </div>

    `).join("");

}


/* =========================
   HTML対策
========================= */

function escapeHtml(text){

  return String(text || "")

    .replaceAll("&","&amp;")

    .replaceAll("<","&lt;")

    .replaceAll(">","&gt;")

    .replaceAll('"',"&quot;")

    .replaceAll("'","&#039;");

}


/* =========================
   起動
========================= */

show();

</script>

</body>
</html>
